version: 2
updates:
  - package-ecosystem: npm
    directory: /model-runtime
    open-pull-requests-limit: 2
    groups:
      model-runtime-maintenance:
        applies-to: version-updates
        patterns: ['*']
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 2
    groups:
      cargo-maintenance:
        applies-to: version-updates
        patterns: ['*']
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 2
    groups:
      python-maintenance:
        applies-to: version-updates
        patterns: ['*']
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    groups:
      actions-maintenance:
        applies-to: version-updates
        patterns: ['*']
    schedule:
      interval: weekly
