name: Versioned binary release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    env:
      WAYWR_BUILDER_IMAGE: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3 strace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Locked model runtime
        run: npm ci --prefix model-runtime --ignore-scripts --no-audit --no-fund && npm run build --prefix model-runtime
      - name: Trust the owned Actions checkout for container build steps
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.99.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Locked checks and assembly
        run: |
          python3 scripts/check-public-content.py
          python3 tests/session_schema_consistency.py
          python3 scripts/test-release-installer.py
          cargo test --locked -p waywr-backend --lib ordinary_
          npm test --prefix model-runtime
          cargo test --locked -p waywr-backend --test shared_models
          cargo test --locked -p waywr --lib ordinary_
          cargo test --locked -p waywr-backend --lib only_exact_proven_builtin_pair_is_allowed_without_enabling_skills_or_tools
          cargo test --locked -p waywr --bin waywr release_guard
          cargo test --locked -p waywr --bin waywr handover_checks
          cargo test --locked -p waywr --lib protocol::tests
          cargo test --locked -p waywr --lib provider_ui_tests
          cargo test --locked -p waywr --lib coordinator_usage
          cargo test --locked -p waywr --lib escape_and_control_c
          cargo test --locked -p waywr --lib idle_ticks_remain
          cargo test --locked -p waywr-backend --lib discussion_switch_is_not_vetoed
          cargo test --locked -p waywr-backend --lib provider_switch
          cargo test --locked -p waywr-backend --lib current_revision_reads
          cargo test --locked -p waywr-backend --lib coordinator_runtime_progress
          cargo test --locked -p waywr-backend --lib oversize_response
          scripts/package-release.sh "$GITHUB_REF_NAME" /tmp/release
          python3 scripts/test-packaged-install.py "/tmp/release/waywr-$GITHUB_REF_NAME-linux-x86_64-gnu.tar.gz"
          python3 scripts/test-project-reopen.py --retired-profiles --provider-navigation --populated-history --activate-profile --coordinator-usage --blocked-send --idle-cpu
          python3 scripts/test-dev-install.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            /tmp/release/*.tar.gz
            /tmp/release/SHA256SUMS
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
